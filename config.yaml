exchange: blofin
mode: isolated          # isolated margin per position. The user accepted full risk;
                        # this caps per-position loss to its own margin but does NOT
                        # cap total account exposure. See README "Risk" section.
universe: all_usdt_perps
trading_mode: live      # demo = $40 paper account, never places live orders
                        # live  = real Blofin account

paper:
  starting_equity: 40.0
  state_path: ./data/paper_state.json
  reset_on_start: false
  top_n: 40

# Synced from data/backtest_best.json ($40 -> ~$124). Live sizing is STOP-BASED
# (1% equity risk per open), not the backtest's all-in cash/slots artifact.
playbook:
  leverage: 10
  max_positions: 3
  stop_loss_pct: 0.03
  take_profit_pct: 0.25
  risk_per_trade_pct: 0.01
  max_portfolio_heat_pct: 0.03
  max_margin_util_pct: 0.35
  target_equity: 120.0
  mix: "breakout+roc_momentum:AND"

loop:
  interval_seconds: 60  # LLM ticks take ~30-50s; keep scheduler from overlapping
  jitter_seconds: 3

llm:
  model: stepfun/step-3.7-flash:free
  base_url: https://inference-api.nousresearch.com/v1
  timeout_seconds: 45
  reasoning_effort: medium
  max_output_tokens: 2000

journal:
  verbatim_window: 30
  summary_refresh_every_ticks: 60
  db_path: ./data/journal.sqlite

# Per user decision: no risk guardrails are enabled. The risk_none module
# is wired in but is an identity function. To add real guardrails later,
# implement hermes_trader/risk.py and swap the import in loop.py.
risk:
  enabled: false

logging:
  level: INFO
  file: ./data/hermes.log
