name: Auto Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-win:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build Windows artifact
        working-directory: KnightTrader
        run: npm run build:win:artifact

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            KnightTrader/dist/**/*.exe
            KnightTrader/dist/**/*.blockmap
          retention-days: 7

  build-mac:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build Mac artifact
        working-directory: KnightTrader
        run: npm run build:mac:artifact

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            KnightTrader/dist/**/*.dmg
            KnightTrader/dist/**/*.zip
          retention-days: 7

  deploy-site:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages
          destination_dir: .
          keep_files: true

  release-publish:
    needs: [build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: win-exe
          path: artifacts/win

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: artifacts/mac

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
        run: |
          win=$(find artifacts/win -type f | head -n 1 || true)
          mac=$(find artifacts/mac -type f | head -n 1 || true)
          if [ -n "$win" ]; then gh release upload "$TAG" "$win" --repo "$GITHUB_REPOSITORY"; fi
          if [ -n "$mac" ]; then gh release upload "$TAG" "$mac" --repo "$GITHUB_REPOSITORY"; fi
