name: Auto Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        default: 'v1.1.8'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-win:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build Windows artifact
        working-directory: KnightTrader
        run: npm run build:win:artifact

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            KnightTrader/dist/**/*.exe
            KnightTrader/dist/**/*.blockmap
          retention-days: 7

  build-mac:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build Mac artifact
        working-directory: KnightTrader
        run: npm run build:mac:artifact

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            KnightTrader/dist/**/*.dmg
            KnightTrader/dist/**/*.zip
          retention-days: 7

  deploy-site:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./temp-site
          destination_dir: .
          keep_files: true
