name: Auto Release and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_ref: ${{ steps.version.outputs.tag_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_ref=$GITHUB_REF" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            LAST_MSG=$(git log -1 --format=%s || true)
            if [[ "$LAST_MSG" == *"bump version"* ]]; then
              echo "Skipping version bump because last commit is already a bump."
              node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('KnightTrader/package.json','utf8')).version)" > /tmp/ver.txt
              VERSION=$(cat /tmp/ver.txt)
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "tag_ref=" >> $GITHUB_OUTPUT
              exit 0
            fi

            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('KnightTrader/package.json', 'utf8'));
              const parts = pkg.version.split('.');
              parts[2] = String(parseInt(parts[2], 10) + 1);
              pkg.version = parts.join('.');
              fs.writeFileSync('KnightTrader/package.json', JSON.stringify(pkg, null, 2) + '\n');
              fs.writeFileSync('/tmp/new.txt', pkg.version);
            "

            NEW=$(cat /tmp/new.txt)

            node -e "
              const fs = require('fs');
              const html = fs.readFileSync('KnightTrader/renderer/index.html', 'utf8');
              const ver = process.argv[1];
              const out = html
                .replace(/id=\"sidebar-version\">v[^<]+/, 'id=\"sidebar-version\">v' + ver)
                .replace(/id=\"about-app-version\">KnightTrader v[^<]+/, 'id=\"about-app-version\">KnightTrader v' + ver)
                .replace(/id=\"popup-app-version\">[^<]+/, 'id=\"popup-app-version\">' + ver);
              fs.writeFileSync('KnightTrader/renderer/index.html', out);
            " "$NEW"

            echo "version=$NEW" >> $GITHUB_OUTPUT

            git add KnightTrader/package.json KnightTrader/renderer/index.html
            git commit -m "chore: bump version to $NEW [skip ci]"
            git tag "$NEW"
            git push origin HEAD:main --follow-tags

            echo "tag_ref=refs/tags/$NEW" >> $GITHUB_OUTPUT
          fi

  build-win:
    needs: prepare
    if: ${{ needs.prepare.outputs.version != '' && needs.prepare.outputs.version != 'skip' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build and publish Windows
        working-directory: KnightTrader
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  build-mac:
    needs: prepare
    if: ${{ needs.prepare.outputs.version != '' && needs.prepare.outputs.version != 'skip' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: KnightTrader
        run: npm ci

      - name: Build and publish Mac
        working-directory: KnightTrader
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy-site:
    needs: prepare
    if: ${{ needs.prepare.outputs.version != '' && needs.prepare.outputs.version != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./temp-site
          destination_dir: .
          keep_files: true
